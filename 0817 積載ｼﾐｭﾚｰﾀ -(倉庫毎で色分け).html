  <style>
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      user-select: none;
    }

    /* グリッド背景 */
    .truck-bed {
      background-image: 
        linear-gradient(to right, rgba(203, 213, 225, 0.5) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(203, 213, 225, 0.5) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* 荷物エレメントベース */
    .placed-item {
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s, opacity 0.2s;
      touch-action: none;
    }
    .placed-item:hover {
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      z-index: 100 !important;
    }
    .placed-item.dragging {
      opacity: 0.85;
      z-index: 200 !important;
      transition: none !important;
    }

    /* 全体回転用アニメーションコンテナ */
    .truck-3d-scene {
      transition: transform 0.3s ease-in-out;
    }

    /* 奥行ラベルの回転アニメーション */
    .dim-depth-label {
      transition: transform 0.3s ease-in-out;
    }

    /* === 印刷設定 === */
    @media print {
      @page {
        size: A4 landscape;
        margin: 5mm;
      }

      html, body {
        zoom: 1.21;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        background: #fff !important;
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
      }

      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* 不要なUI要素を非表示 */
      aside, header, .no-print, #vehicle-tab-container { 
        display: none !important; 
      }
      
      /* メインエリア・ビューポートを印刷範囲に連動 */
      body, main, #main-area, #viewport-stage, #pan-zoom-container {
        display: block !important;
        height: auto !important;
        width: 100% !important;
        overflow: visible !important;
        position: static !important;
        transform: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      /* 車両配置カードの自動レスポンシブ連動グリッド */
      #vehicles-grid-container {
        display: flex !important;
        flex-wrap: wrap !important;
        flex-direction: row !important;
        justify-content: flex-start !important;
        align-items: flex-start !important;
        gap: 12px !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 auto !important;
      }

      .vehicle-card-wrapper {
        box-sizing: border-box !important;
        flex: 1 1 31% !important;
        max-width: 31% !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        margin-bottom: 8px !important;
        padding: 6px !important;
        border: 1px solid #94a3b8 !important;
        box-shadow: none !important;
        background-color: #ffffff !important;
      }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

  <!-- ヘッダー -->
  <header class="bg-slate-900 text-white px-6 py-3 shadow-md flex justify-between items-center shrink-0 z-30">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-wand-magic-sparkles text-amber-400 text-2xl"></i>
      <div>
        <h1 class="text-lg font-bold tracking-wide flex items-center gap-2">
          トラック積載配置図 自動生成シミュレーター
        </h1>
        <p class="text-[11px] text-slate-400">機種マスター連動・ワンクリック自動レイアウト・複数車両対応</p>
      </div>
    </div>

    <!-- サマリー情報 -->
    <div class="flex items-center gap-4">
      <div class="hidden md:flex items-center gap-4 bg-slate-800/90 px-4 py-1.5 rounded-lg border border-slate-700 text-sm">
        <div>
          <span class="text-slate-400 text-xs">選択車種:</span>
          <span id="header-vehicle-name" class="font-bold text-amber-300 ml-1">庸車</span>
        </div>
        <div class="h-4 w-px bg-slate-600"></div>
        <div>
          <span class="text-slate-400 text-xs">床面積利用率:</span>
          <span id="header-occupancy-rate" class="font-bold text-emerald-400 ml-1">0%</span>
        </div>
        <div class="h-4 w-px bg-slate-600"></div>
        <div>
          <span class="text-slate-400 text-xs">積載個数:</span>
          <span id="header-item-count" class="font-bold text-white ml-1">0 台</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 車両追加タブエリア -->
  <div id="vehicle-tab-container" class="bg-slate-800 text-white px-4 py-2 border-b border-slate-700 flex items-center gap-2 overflow-x-auto shrink-0 z-20">
    <button id="btn-add-vehicle" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 shrink-0 transition shadow">
      <i class="fa-solid fa-plus"></i> 車両を追加
    </button>
    <div id="vehicle-tabs" class="flex items-center gap-1.5">
      <!-- 車両タブが動的に追加されます -->
    </div>
  </div>

  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- 左側: 操作パネル -->
    <aside class="w-88 bg-white border-r border-slate-200 p-4 flex flex-col gap-4 overflow-y-auto shrink-0 shadow-sm z-20" style="width: 360px;">
      
      <!-- 1. 車種選択 -->
      <section class="bg-slate-50 p-3 rounded-xl border border-slate-200 shrink-0">
        <h2 class="text-xs font-bold text-slate-700 mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-truck text-amber-600"></i> ① 車種（荷台サイズ）選択
        </h2>
        <select id="vehicle-select" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-medium focus:ring-2 focus:ring-amber-500 outline-none shadow-sm cursor-pointer">
        </select>
        
        <div class="grid grid-cols-2 gap-2 mt-2 text-[11px]">
          <div>
            <label class="block text-slate-500 mb-0.5">荷台幅 (mm)</label>
            <input type="number" id="input-truck-width" class="w-full border border-slate-300 rounded px-2 py-1 text-right font-mono bg-white" step="10">
          </div>
          <div>
            <label class="block text-slate-500 mb-0.5">荷台奥行 (mm)</label>
            <input type="number" id="input-truck-depth" class="w-full border border-slate-300 rounded px-2 py-1 text-right font-mono bg-white" step="10">
          </div>
        </div>
      </section>

      <!-- Excel / CSV 読み込みエリア（ドラッグ＆ドロップ対応カード） -->
      <section id="excel-drop-zone" class="bg-emerald-50/80 p-3 rounded-xl border-2 border-dashed border-emerald-300 space-y-2 shrink-0 transition-colors duration-200 cursor-pointer hover:bg-emerald-100/70">
        <h2 class="text-xs font-bold text-emerald-800 flex items-center gap-1.5 pointer-events-none">
          <i class="fa-solid fa-file-excel text-emerald-600"></i> Excelから一括読み込み
        </h2>
        <div class="pointer-events-none text-center py-1">
          <i class="fa-solid fa-cloud-arrow-up text-emerald-500 text-xl mb-1"></i>
          <p class="text-[11px] font-bold text-emerald-800">ここにExcelファイルをドロップ</p>
          <p class="text-[10px] text-emerald-600">または下のボタンから選択</p>
        </div>
        <div>
          <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" class="hidden">
          <button type="button" id="btn-trigger-excel" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 rounded-lg transition text-xs flex items-center justify-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-file-import"></i> ファイルを選択
          </button>
        </div>
        <p class="text-[10px] text-emerald-700 leading-tight pointer-events-none">
          ※型番が入力されたセルの右隣のセルから数量を取得します（半角・全角区別なし）
        </p>
      </section>

      <!-- 2. 機種選択 -->
      <section class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2.5 shrink-0">
        <h2 class="text-xs font-bold text-slate-700 flex items-center justify-between">
          <span class="flex items-center gap-1.5"><i class="fa-solid fa-boxes-stacked text-blue-600"></i> ② 個別荷物選択</span>
        </h2>
        
        <div>
          <label class="block text-[11px] text-slate-500 mb-0.5">分類フィルタ</label>
          <select id="category-select" class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-blue-500 outline-none">
            <option value="">すべての分類 (全表示)</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] text-slate-500 mb-0.5">型番・商品名</label>
          <select id="item-dataset-select" class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-blue-500 outline-none font-medium">
          </select>
        </div>

        <!-- プレビューと数量 -->
        <div class="bg-blue-50/80 p-2.5 rounded-lg border border-blue-200 text-xs">
          <div class="flex justify-between items-center mb-1.5">
            <span class="font-bold text-blue-900 truncate max-w-[190px]" id="preview-item-name">商品名</span>
            <span class="text-[10px] bg-blue-200 text-blue-800 px-1.5 py-0.5 rounded font-mono" id="preview-item-size">W0×D0</span>
          </div>
          <div class="grid grid-cols-3 gap-1 text-[11px]">
            <div>
              <span class="text-slate-500 block text-[10px]">幅(W)</span>
              <input type="number" id="item-w-input" class="w-full border border-slate-300 rounded px-1 py-0.5 font-mono text-right bg-white text-xs">
            </div>
            <div>
              <span class="text-slate-500 block text-[10px]">奥行(D)</span>
              <input type="number" id="item-d-input" class="w-full border border-slate-300 rounded px-1 py-0.5 font-mono text-right bg-white text-xs">
            </div>
            <div>
              <span class="text-slate-500 block text-[10px]">数量</span>
              <input type="number" id="item-count-input" value="1" min="1" max="50" class="w-full border border-slate-300 rounded px-1 py-0.5 font-mono text-right bg-white text-xs">
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs">
          <span class="text-slate-600">表示カラー:</span>
          <div class="flex gap-1.5" id="color-picker-container">
            <button type="button" class="color-btn w-5 h-5 rounded-full border-2 border-slate-900 bg-blue-500" data-color="#3b82f6"></button>
            <button type="button" class="color-btn w-5 h-5 rounded-full border-2 border-transparent bg-emerald-500" data-color="#10b981"></button>
            <button type="button" class="color-btn w-5 h-5 rounded-full border-2 border-transparent bg-amber-500" data-color="#f59e0b"></button>
            <button type="button" class="color-btn w-5 h-5 rounded-full border-2 border-transparent bg-purple-500" data-color="#8b5cf6"></button>
            <button type="button" class="color-btn w-5 h-5 rounded-full border-2 border-transparent bg-rose-500" data-color="#f43f5e"></button>
          </div>
        </div>

        <button id="btn-add-item" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2 rounded-lg transition text-xs flex items-center justify-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-plus"></i> リストに追加
        </button>
      </section>

      <!-- 3. 配置作成アクション -->
      <section class="space-y-2 shrink-0">
        <button id="btn-auto-pack" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-extrabold py-2.5 rounded-xl transition text-xs flex items-center justify-center gap-2 shadow-md">
          <i class="fa-solid fa-wand-magic-sparkles text-sm"></i> デッドスペース最小化・最適配置
        </button>
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-print" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-medium py-1.5 rounded-lg transition text-xs flex items-center justify-center gap-1">
            <i class="fa-solid fa-print"></i> 印刷 / PDF保存
          </button>
          <button id="btn-clear-all" class="bg-white hover:bg-red-50 text-red-600 border border-red-200 font-medium py-1.5 rounded-lg transition text-xs flex items-center justify-center gap-1">
            <i class="fa-solid fa-trash-can"></i> 全削除
          </button>
        </div>
      </section>

      <!-- リスト -->
      <section class="border-t border-slate-200 pt-2 shrink-0">
        <div class="flex justify-between items-center mb-1.5">
          <h2 class="text-xs font-bold text-slate-600 uppercase">選択中の荷物一覧</h2>
          <span id="item-type-count" class="text-[11px] text-slate-400">0種類</span>
        </div>
        <div id="item-list-container" class="space-y-1.5 pr-1">
        </div>
      </section>

    </aside>

    <!-- 右側: メイン配置キャンバスエリア -->
    <main id="main-area" class="flex-1 bg-slate-200/60 p-4 flex flex-col items-center relative overflow-y-auto select-none cursor-grab active:cursor-grabbing">

      <!-- ビューポート -->
      <div id="viewport-stage" class="relative flex-1 w-full min-h-0 p-2 overflow-y-auto">
        <div id="pan-zoom-container" class="relative transition-transform duration-75 w-full">

  // --- 全角・半角・大文字小文字・スペース等を吸収して正規化するヘルパー関数 ---
  function normalizeText(str) {
    if (!str) return '';
    return String(str)
      .normalize('NFKC')                          // 全角英数字/記号・半角カナを統一
      .toLowerCase()                              // 大文字小文字を統一
      .replace(/[\s\u3000\-_‐－―ー]/g, '');       // 空白、ハイフン、長音記号等の表記揺れを除去
  }

  // --- カードへのファイルドラッグ＆ドロップ設定 ---
  function setupDragAndDrop(dropZone) {
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
      }, false);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => {
        dropZone.classList.add('border-emerald-500', 'bg-emerald-100/90', 'scale-[1.02]');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => {
        dropZone.classList.remove('border-emerald-500', 'bg-emerald-100/90', 'scale-[1.02]');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;

      if (files && files.length > 0) {
        const file = files[0];
        const ext = file.name.split('.').pop().toLowerCase();
        if (['xlsx', 'xls', 'csv'].includes(ext)) {
          processExcelFile(file);
        } else {
          alert('ExcelまたはCSVファイル（.xlsx, .xls, .csv）をドロップしてください。');
        }
      }
    });
  }

  // --- Ctrl+X / Ctrl+V 及び Delete キーボードショートカットイベントのセットアップ ---
  function setupCutAndPaste() {
    window.addEventListener('keydown', (e) => {
      // テキスト入力中は動作をスキップ
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
        return;
      }

      // Delete キー または Backspace キー (削除)
      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (activeDraggingTarget) {
          e.preventDefault();
          const { item, vehicleIndex } = activeDraggingTarget;
          const targetVehicle = vehicles[vehicleIndex];
          if (!targetVehicle) return;

          // 車両から削除
          targetVehicle.placedItems = targetVehicle.placedItems.filter(i => i.id !== item.id);
          activeDraggingTarget = null;

          renderPlacedItems();
          updateMetrics();
        }
      }

      // Ctrl+X または Cmd+X (カット)
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') {
        if (activeDraggingTarget) {
          e.preventDefault();
          const { item, vehicleIndex } = activeDraggingTarget;
          const targetVehicle = vehicles[vehicleIndex];
          if (!targetVehicle) return;

          // 対象荷物を保持（位置情報は初期化）
          clipboardItem = {
            name: item.name,
            width: item.width,
            depth: item.depth,
            color: item.color
          };

          // 元の車両から削除
          targetVehicle.placedItems = targetVehicle.placedItems.filter(i => i.id !== item.id);
          activeDraggingTarget = null;

          renderPlacedItems();
          updateMetrics();
        }
      }

      // Ctrl+V または Cmd+V (ペースト)
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
        if (clipboardItem) {
          e.preventDefault();
          const currentV = getCurrentVehicle();

          // アクティブな車両にコピーを追加
          currentV.placedItems.push({
            id: 'item-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
            name: clipboardItem.name,
            width: clipboardItem.width,
            depth: clipboardItem.depth,
            color: clipboardItem.color,
            x: 0,
            y: 0
          });

          // 自動パッキングを実行して綺麗に配置
          autoPackItems();
        }
      }
    });
  }

  // --- 複数車両管理ロジック ---
  function getCurrentVehicle() {
    return vehicles[currentVehicleIndex];
  }

  function addNewVehicle(preset, isInitial = false) {
    const vehicleId = 'v-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
    const newVehicle = {
      id: vehicleId,
      name: `${preset.name} (${vehicles.length + 1})`,
      width: preset.width,
      depth: preset.depth,
      placedItems: []
    };
    vehicles.push(newVehicle);
    if (!isInitial) {
      currentVehicleIndex = vehicles.length - 1;
    }
    renderTabs();
    if (!isInitial) {
      switchVehicle(currentVehicleIndex);
    }
    return newVehicle;
  }

  function renderTabs() {

    vehicles.forEach((v, index) => {

      const isActive = index === currentVehicleIndex;
      tab.className = `flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer transition select-none ${
        isActive 
          ? 'bg-amber-500 text-slate-950 shadow-md' 
          : 'bg-slate-700 text-slate-300 hover:bg-slate-600 hover:text-white'
      }`;

      tab.innerHTML = `
        <span class="truncate max-w-[120px]"><i class="fa-solid fa-truck text-[11px] mr-1"></i>${v.name}</span>

      `;

      tab.addEventListener('click', (e) => {
        if (e.target.closest('.btn-remove-tab')) return;
        switchVehicle(index);
      });

      if (vehicles.length > 1) {
        const removeBtn = tab.querySelector('.btn-remove-tab');
        removeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          removeVehicle(index);
        });
      }

      vehicleTabs.appendChild(tab);
    });

  // --- Excel / CSV ファイル読み込み処理関数 ---

// --- Excel / CSV 読み込み＆自動照合コア処理（型式列・台数列固定検索版） ---
  function processExcelFile(file) {
    const reader = new FileReader();

    reader.onload = function(evt) {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });

        // 1. 最初のシートを参照
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        if (!jsonData || jsonData.length === 0) {
          alert("ファイル内にデータが見つかりませんでした。");
          return;
        }

        // マスターデータの型式名を事前に正規化
        const normalizedCargoData = RAW_CARGO_DATA.map(cargo => ({
          ...cargo,
          normName: normalizeText(cargo.name)
        }));

        // --- 2. 1行目から順に検索し、最初に型式および台数が入力されている列番号を特定 ---
        let modelColumnIndex = -1;
        let qtyColumnIndex = -1;
        let startRowIndex = -1;

        for (let r = 0; r < jsonData.length; r++) {
          const row = jsonData[r];
          if (!Array.isArray(row)) continue;

          for (let c = 0; c < row.length; c++) {
            const cellValue = row[c];
            if (cellValue === null || cellValue === undefined) continue;

            const targetNormStr = normalizeText(cellValue);
            if (!targetNormStr) continue;

            // マスタデータと照合して型式かどうか判定
            const isMatched = normalizedCargoData.some(cargo => 
              cargo.normName && targetNormStr.includes(cargo.normName)
            );

            if (isMatched) {
              // 型式列より右側のセルから最初に数値が見つかる列を「台数列」として特定
              for (let rightCol = c + 1; rightCol < row.length; rightCol++) {
                const rightVal = row[rightCol];
                if (rightVal !== null && rightVal !== undefined && rightVal !== '') {
                  const parsedNum = parseInt(rightVal, 10);
                  if (!isNaN(parsedNum) && parsedNum > 0) {
                    modelColumnIndex = c;       // 型式列番号を固定
                    qtyColumnIndex = rightCol;  // 台数列番号を固定
                    startRowIndex = r;          // デフォルトの開始位置

                    // --- 同列の上方向へ検索し、ヘッダー（型式・商品名等）の直下の行を開始位置に設定 ---
                    const headerKeywords = ['機種', '型式', '商品名', '品名', '名称', 'アイテム'];
                    for (let topR = r - 1; topR >= 0; topR--) {
                      const topCell = jsonData[topR] ? jsonData[topR][modelColumnIndex] : null;
                      if (topCell !== null && topCell !== undefined) {
                        const topNormStr = normalizeText(topCell);
                        if (headerKeywords.some(h => topNormStr.includes(normalizeText(h)))) {
                          startRowIndex = topR + 1; // ヘッダー行のすぐ次の行を開始位置にする
                          break;
                        }
                      }
                    }

                    break;
                  }
                }
              }
            }
            if (modelColumnIndex !== -1) break;
          }
          if (modelColumnIndex !== -1) break; // 最初に検出された時点で列探索を終了
        }

        if (modelColumnIndex === -1 || qtyColumnIndex === -1) {
          alert("マスタに該当する型式、または対応する数量データが見つかりませんでした。");
          return;
        }

        // --- 3. 特定された「型式列」と「台数列」からのみデータを抽出 ---
        let addedCount = 0;
        const currentV = getCurrentVehicle();
        const unmappedModelsMap = new Map();

        for (let r = startRowIndex; r < jsonData.length; r++) {
          const row = jsonData[r];
          if (!Array.isArray(row)) continue;

          // 指定された「型式列」のセルを参照
          const cellValue = row[modelColumnIndex];
          if (cellValue === null || cellValue === undefined) continue;

          const cellStr = String(cellValue).trim();
          const targetNormStr = normalizeText(cellValue);

          if (!targetNormStr) continue;
          if (['機種', '型式', '商品名', '品名', '台数', '数量', '名称', 'アイテム'].some(h => targetNormStr.includes(h))) {
            continue;
          }

          // 指定された「台数列」からのみ数量を取得
          let qty = 0; // デフォルト初期値（取得できなかった場合も安全のため0）
          const qtyVal = row[qtyColumnIndex];

          // セルが存在し、かつ空文字でない場合のみ数値判定を行う
          if (qtyVal !== null && qtyVal !== undefined && String(qtyVal).trim() !== '') {
            // 数値以外（「台」などの全角・半角テキスト）を除去して数値化
            const parsedNum = parseInt(String(qtyVal).replace(/[^0-9]/g, ''), 10);

            // NaN（数値に変換できない文字列のみだった場合）でなければ0を含めて採用
            if (!isNaN(parsedNum)) {
              qty = parsedNum;
            }
          } else {
            // 指定列が空欄・未入力の場合の扱い
            // ※「空欄なら1台として扱う」仕様にしたい場合はここを qty = 1; に変更してください
            qty = 0; 
          }

          // マスタ照合
          const matchedCargo = normalizedCargoData.find(cargo => 
            cargo.normName && targetNormStr.includes(cargo.normName)
          );

          if (matchedCargo) {
            // 1. matchedCargoの倉庫名から色を取得（未登録の倉庫の場合はデフォルト色を設定）
            const itemColor = WAREHOUSE_COLORS[matchedCargo.warehouse] || '#94a3b8';

            // 車両データへ追加
            for (let q = 0; q < qty; q++) {
              currentV.placedItems.push({
                id: 'item-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                name: matchedCargo.name,
                width: matchedCargo.w,
                depth: matchedCargo.d,
                color: itemColor, // ← selectedColor から取得した色に変更
                x: 0,
                y: 0
              });
              addedCount++;
            }
          } else {
            // マスタ未該当の文字列（純粋な数値セルなどを除外）の台数をカウント
            if (isNaN(Number(cellStr))) {
              const currentQty = unmappedModelsMap.get(cellStr) || 0;
              unmappedModelsMap.set(cellStr, currentQty + qty);
            }
          }
        }

        // --- 4. 結果表示アラート ---
        let resultMsg = "";
        if (addedCount > 0) {
          resultMsg += `${addedCount} 個の荷物を現在の車両「${currentV.name}」に追加しました。\n`;
        } else {
          resultMsg += "マスタに該当する商品が見つかりませんでした。\n";
        }

        if (unmappedModelsMap.size > 0) {
          let totalUnmappedQty = 0;
          unmappedModelsMap.forEach(q => totalUnmappedQty += q);

          resultMsg += `\n【注意：マスタ未該当の機種/文字列 (${unmappedModelsMap.size}種類 / 計${totalUnmappedQty}台)】\n`;
          unmappedModelsMap.forEach((qty, modelName) => {
            resultMsg += `・${modelName} : ${qty}台\n`;
          });

          if (confirm(resultMsg + "\n未該当の機種一覧をExcelファイルとしてダウンロードしますか？")) {
            exportUnmappedToExcel(unmappedModelsMap);
          }
        } else {
          alert(resultMsg);
        }

        if (addedCount > 0) {
          autoPackItems();
        }

      } catch (err) {
        console.error(err);
        alert("ファイルの読み込み中にエラーが発生しました。");
      }
    };

    reader.readAsArrayBuffer(file);
  }

  // マスタ未該当の機種一覧をExcelファイルとして出力する関数
  function exportUnmappedToExcel(unmappedModelsMap) {
    if (!unmappedModelsMap || unmappedModelsMap.size === 0) return;

    const excelData = [
      ["No.", "マスタ未該当機種・文字列", "台数"]
    ];

    let index = 1;
    let totalQty = 0;
    unmappedModelsMap.forEach((qty, modelName) => {
      excelData.push([index++, modelName, qty]);
      totalQty += qty;
    });

    excelData.push(["", "合計", totalQty]);

    const worksheet = XLSX.utils.aoa_to_sheet(excelData);

    worksheet['!cols'] = [
      { wch: 8 },  // No.
      { wch: 35 }, // 機種名
      { wch: 12 }  // 台数
    ];

    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "未該当機種一覧");

    const today = new Date().toISOString().split('T')[0];
    const fileName = `マスタ未該当リスト_${today}.xlsx`;
    XLSX.writeFile(workbook, fileName);
  }

function setupPanAndZoom() {
    // ホイールイベントでカーソル位置を中心に拡大縮小
    mainArea.addEventListener('wheel', (e) => {
      e.preventDefault();

      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const nextZoom = Math.max(0.3, Math.min(4.0, viewZoom * zoomFactor));

      // ズーム比率（新しい倍率 / 現在の倍率）
      const zoomRatio = nextZoom / viewZoom;

      // mainArea（視界の枠）に対するカーソルの相対座標を取得
      const rect = mainArea.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      // カーソル位置を中心に移動量を補正（Pan位置の再計算）
      panX = mouseX - zoomRatio * (mouseX - panX);
      panY = mouseY - zoomRatio * (mouseY - panY);

      viewZoom = nextZoom;
      applyTransform();
    }, { passive: false });

    // ドラッグ移動（パン）処理
    mainArea.addEventListener('pointerdown', (e) => {
      if (
        e.target.closest('.placed-item') || 
        e.target.closest('.vehicle-card-header') || 
        e.target.closest('button') || 
        e.target.closest('select') || 
        e.target.closest('input')
      ) {
        return;
      }
      isPanning = true;
      panStartX = e.clientX - panX;
      panStartY = e.clientY - panY;
      mainArea.setPointerCapture(e.pointerId);
    });

    mainArea.addEventListener('pointermove', (e) => {
      if (!isPanning) return;
      panX = e.clientX - panStartX;
      panY = e.clientY - panStartY;
      applyTransform();
    });

    const stopPan = (e) => {
      if (isPanning) {
        isPanning = false;
        try { mainArea.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    };

    mainArea.addEventListener('pointerup', stopPan);
    mainArea.addEventListener('pointercancel', stopPan);

    // リセットボタンの設定
    btnResetView.addEventListener('click', () => {
      viewZoom = 1.0;
      panX = 0;
      panY = 0;
      applyTransform();
    });
  }

  // 変形（Translate / Scale）の適用
  function applyTransform() {
    panZoomContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${viewZoom})`;
    panZoomContainer.style.transformOrigin = '0 0'; // 左上基準で計算するため必須
  }

  function autoPackItems() {
    const v = getCurrentVehicle();
    if (v.placedItems.length === 0) {
      renderPlacedItems();
      updateMetrics();
      return;
    }

    const V_WIDTH = v.width;
    const V_DEPTH = v.depth;

    function simulatePacking(itemsList, packingStrategy) {
      const resultItems = [];
      let totalOverflow = 0;
      let maxYUsed = 0;

      itemsList.forEach(itemOriginal => {
        const item = { ...itemOriginal };
        let bestCandidate = null;

        let orientations;
        if (packingStrategy.allowRotation) {
          if (packingStrategy.preferOrientation === 'force_rotated') {
            orientations = [{ w: item.depth, d: item.width }, { w: item.width, d: item.depth }];
          } else if (packingStrategy.preferOrientation === 'aspect') {
            orientations = (item.width >= item.depth)
              ? [{ w: item.width, d: item.depth }, { w: item.depth, d: item.width }]
              : [{ w: item.depth, d: item.width }, { w: item.width, d: item.depth }];
          } else {
            orientations = [{ w: item.width, d: item.depth }, { w: item.depth, d: item.width }];
          }
        } else {
          orientations = [{ w: item.width, d: item.depth }];
        }

        orientations.forEach(ori => {
          if (ori.w > V_WIDTH || ori.d > V_DEPTH) return;

          const candidateXPoints = new Set([0]);
          const candidateYPoints = new Set([0]);

          resultItems.forEach(placed => {
            if (placed.y < V_DEPTH) {
              if (placed.x + placed.width <= V_WIDTH - ori.w) candidateXPoints.add(placed.x + placed.width);
              if (placed.y + placed.depth <= V_DEPTH - ori.d) candidateYPoints.add(placed.y + placed.depth);
            }
          });

          const sortedY = Array.from(candidateYPoints).sort((a,b) => a - b);
          const sortedX = Array.from(candidateXPoints).sort((a,b) => a - b);

          for (const y of sortedY) {
            for (const x of sortedX) {
              if (x + ori.w > V_WIDTH || y + ori.d > V_DEPTH) continue;

              let hasOverlap = false;
              for (const p of resultItems) {
                if (p.y >= V_DEPTH) continue;
                if (
                  x < p.x + p.width &&
                  x + ori.w > p.x &&
                  y < p.y + p.depth &&
                  y + ori.d > p.y
                ) {
                  hasOverlap = true;
                  break;
                }
              }

              if (!hasOverlap) {
                if (!bestCandidate || y < bestCandidate.y || (y === bestCandidate.y && x < bestCandidate.x)) {
                  bestCandidate = { x, y, w: ori.w, d: ori.d };
                }
                break;
              }
            }
            if (bestCandidate && y > bestCandidate.y) break;
          }
        });

        if (bestCandidate) {
          item.width = bestCandidate.w;
          item.depth = bestCandidate.d;
          item.x = bestCandidate.x;
          item.y = bestCandidate.y;
          maxYUsed = Math.max(maxYUsed, item.y + item.depth);
        } else {
          item.x = 0;
          item.y = V_DEPTH + totalOverflow;
          totalOverflow += item.depth + 20;
        }

        resultItems.push(item);
      });

      const overflowCount = resultItems.filter(i => i.y >= V_DEPTH).length;
      
      let packedArea = 0;
      resultItems.forEach(i => {
        if (i.y < V_DEPTH) packedArea += (i.width * i.depth);
      });

      const score = (overflowCount * 1000000000) - (packedArea * 100) + maxYUsed;

      return { resultItems, score, overflowCount, maxYUsed, packedArea };
    }

    const strategies = [
      { sortFn: (a, b) => Math.max(b.width, b.depth) - Math.max(a.width, a.depth), allowRotation: true, preferOrientation: 'default' },
      { sortFn: (a, b) => (b.width * b.depth) - (a.width * a.depth), allowRotation: true, preferOrientation: 'default' },
      { sortFn: (a, b) => (b.width * b.depth) - (a.width * a.depth), allowRotation: true, preferOrientation: 'force_rotated' },
      { sortFn: (a, b) => b.width - a.width, allowRotation: true, preferOrientation: 'aspect' },
      { sortFn: (a, b) => (b.width + b.depth) - (a.width + a.depth), allowRotation: true, preferOrientation: 'default' },
      { sortFn: (a, b) => Math.min(b.width, b.depth) - Math.min(a.width, a.depth), allowRotation: true, preferOrientation: 'default' }
    ];

    let bestSolution = null;

    strategies.forEach(strat => {
      const sortedItems = [...v.placedItems].sort(strat.sortFn);
      const simResult = simulatePacking(sortedItems, strat);

      if (!bestSolution || simResult.score < bestSolution.score) {
        bestSolution = simResult;
      }
    });

    if (bestSolution) {
      const fittedItems = bestSolution.resultItems.filter(i => i.y < V_DEPTH);
      const overflowItems = bestSolution.resultItems.filter(i => i.y >= V_DEPTH);

      v.placedItems = fittedItems;

      if (overflowItems.length > 0) {
        let nextVehicleIndex = currentVehicleIndex + 1;
        let nextVehicle = vehicles[nextVehicleIndex];

        if (!nextVehicle) {
          nextVehicle = addNewVehicle(VEHICLE_PRESETS[0], true);
        }

        overflowItems.forEach(item => {
          nextVehicle.placedItems.push({
            ...item,
            x: 0,
            y: 0
          });
        });

        renderPlacedItems();
        updateMetrics();

        const tempCurrentIndex = currentVehicleIndex;
        currentVehicleIndex = nextVehicleIndex;
        autoPackItems();
        currentVehicleIndex = tempCurrentIndex;

        return;
      }
    }

    renderPlacedItems();
    updateMetrics();
  }

          <!-- 横寸法 -->
          <div class="w-full flex items-center justify-center mb-1 text-slate-500 font-mono text-[10px] shrink-0" style="width: ${bedPixelW + 8}px;">
            <div class="h-1.5 border-l border-slate-400"></div>
            <div class="flex-1 border-t border-dashed border-slate-400 relative flex justify-center items-center">
              <span class="bg-slate-100 px-1 text-[10px] font-semibold text-slate-700">幅 ${v.width.toLocaleString()} mm</span>
            </div>
            <div class="h-1.5 border-r border-slate-400"></div>
          </div>

          <div class="flex items-center justify-center">
            <!-- 縦寸法 -->
            <div class="flex flex-col items-center justify-center mr-1 text-slate-500 font-mono text-[10px] h-full shrink-0">
              <div class="w-1.5 border-t border-slate-400"></div>
              <div class="flex-1 border-l border-dashed border-slate-400 relative flex justify-center items-center min-h-[60px]">
                <span class="dim-depth-label bg-slate-100 px-0.5 text-[10px] font-semibold text-slate-700 [writing-mode:vertical-lr]">奥行 ${v.depth.toLocaleString()} mm</span>
              </div>
              <div class="w-1.5 border-b border-slate-400"></div>
            </div>

            <!-- 荷台領域本体 -->
            <div class="truck-container relative bg-slate-900 border-2 border-slate-900 rounded-sm shadow-md flex flex-col overflow-hidden" style="width: ${bedPixelW + 4}px;">
              <div class="w-full bg-slate-900 text-white text-[7px] font-bold py-0.5 text-center tracking-widest uppercase flex items-center justify-center gap-1 shrink-0 z-10">
                <i class="fa-solid fa-caret-up text-amber-400"></i> 前方
              </div>

              <div id="truck-bed-${v.id}" class="truck-bed relative bg-white overflow-hidden" style="width: ${bedPixelW}px; height: ${bedPixelH}px;">
              </div>

              <div class="w-full bg-slate-300 border-t border-slate-400 text-slate-700 text-[7px] font-bold py-0.5 text-center tracking-wider shrink-0 z-10">
                後方
              </div>
            </div>
          </div>
        </div>
      `;

      // 上部選択車種カード要素のクリックイベント設定
      const cardHeader = cardWrapper.querySelector('.vehicle-card-header');
      cardHeader.addEventListener('click', (e) => {
        e.stopPropagation();
        switchVehicle(vIndex);
      });

      // キーボード操作（Enter / Space）対応
      cardHeader.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          switchVehicle(vIndex);
        }
      });

      vehiclesGridContainer.appendChild(cardWrapper);

      // 車両ごとの荷物要素を描画
      const currentTruckBed = document.getElementById(`truck-bed-${v.id}`);
      v.placedItems.forEach(item => {
        const el = document.createElement('div');
        el.className = 'placed-item absolute rounded border border-white/80 flex flex-col justify-center items-center text-white cursor-grab active:cursor-grabbing select-none shadow-sm overflow-visible';
        el.id = item.id;

        const wPx = Math.max(10, item.width * scale);
        const dPx = Math.max(10, item.depth * scale);

        el.style.width = `${wPx}px`;
        el.style.height = `${dPx}px`;
        el.style.left = `${item.x * scale}px`;
        el.style.top = `${item.y * scale}px`;
        el.style.backgroundColor = item.color;

        const fontSize = Math.max(7, Math.min(10, Math.min(wPx, dPx) / 4.5));

        el.innerHTML = `
          <div class="font-bold truncate px-0.5 pointer-events-none leading-tight" style="font-size: ${fontSize}px;">
            ${item.name}
          </div>
          <div class="opacity-90 font-mono pointer-events-none leading-tight" style="font-size: ${Math.max(6, fontSize - 2)}px;">
            ${item.width}×${item.depth}
          </div>
        `;

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (el.dataset.wasDragged === 'true') return;
          if (currentVehicleIndex !== vIndex) {
            switchVehicle(vIndex);
          }
          rotateItem(item.id);
        });

        // マウスオーバー時に対象として保持（ドラッグ開始前にもカットや削除ができるように）
        el.addEventListener('pointerenter', () => {
          activeDraggingTarget = { item, vehicleIndex: vIndex };
        });
        el.addEventListener('pointerleave', () => {
          if (activeDraggingTarget && !el.classList.contains('dragging')) {
            activeDraggingTarget = null;
          }
        });

        setupDrag(el, item, vIndex);
        currentTruckBed.appendChild(el);
      });
    });

    updateItemListUI();
  }

  function setupDrag(element, item, vehicleIndex) {
    let startX, startY, origX, origY;

    element.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.stopPropagation();

      // 現在ドラッグ中のアイテムを記録（Ctrl+X や Delete 用）
      activeDraggingTarget = { item, vehicleIndex };

      if (currentVehicleIndex !== vehicleIndex) {
        switchVehicle(vehicleIndex);
      }

      const v = getCurrentVehicle();

      element.setPointerCapture(e.pointerId);
      element.classList.add('dragging');
      element.dataset.wasDragged = 'false';

      startX = e.clientX;
      startY = e.clientY;
      origX = item.x;
      origY = item.y;

      const onPointerMove = (pe) => {
        let clientDx = pe.clientX - startX;
        let clientDy = pe.clientY - startY;

        let dx = (clientDx / viewZoom) / scale;
        let dy = (clientDy / viewZoom) / scale;

        if (Math.abs(pe.clientX - startX) > 3 || Math.abs(pe.clientY - startY) > 3) {
          element.dataset.wasDragged = 'true';
        }

        let newX = Math.round((origX + dx) / 10) * 10;
        let newY = Math.round((origY + dy) / 10) * 10;

        newX = Math.max(0, Math.min(Math.max(0, v.width - item.width), newX));
        newY = Math.max(0, Math.min(Math.max(0, v.depth - item.depth), newY));

        v.placedItems.forEach(other => {
          if (other.id === item.id) return;

          const isOverlapping = 
            newX < other.x + other.width &&
            newX + item.width > other.x &&
            newY < other.y + other.depth &&
            newY + item.depth > other.y;

          if (isOverlapping) {
            const overlapLeft   = (newX + item.width) - other.x;
            const overlapRight  = (other.x + other.width) - newX;
            const overlapTop    = (newY + item.depth) - other.y;
            const overlapBottom = (other.y + other.depth) - newY;

            const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

            if (minOverlap === overlapLeft)   newX = other.x - item.width;
            else if (minOverlap === overlapRight)  newX = other.x + other.width;
            else if (minOverlap === overlapTop)    newY = other.y - item.depth;
            else if (minOverlap === overlapBottom) newY = other.y + other.depth;
          }
        });

        newX = Math.max(0, Math.min(Math.max(0, v.width - item.width), newX));
        newY = Math.max(0, Math.min(Math.max(0, v.depth - item.depth), newY));

        item.x = newX;
        item.y = newY;

        element.style.left = `${newX * scale}px`;
        element.style.top = `${newY * scale}px`;

        updateMetrics();
      };

      const onPointerUp = (pe) => {
        try { element.releasePointerCapture(pe.pointerId); } catch(err) {}
        element.classList.remove('dragging');
        element.removeEventListener('pointermove', onPointerMove);
        element.removeEventListener('pointerup', onPointerUp);
      };

      element.addEventListener('pointermove', onPointerMove);
      element.addEventListener('pointerup', onPointerUp);
    });
  }

  function rotateItem(id) {
    const v = getCurrentVehicle();
    const item = v.placedItems.find(i => i.id === id);
    if (!item) return;

    const tmp = item.width;
    item.width = item.depth;
    item.depth = tmp;

    if (item.x + item.width > v.width) {
      item.x = Math.max(0, v.width - item.width);
    }
    if (item.y + item.depth > v.depth) {
      item.y = Math.max(0, v.depth - item.depth);
    }

    v.placedItems.forEach(other => {
      if (other.id === item.id) return;

      const isOverlapping = 
        item.x < other.x + other.width &&
        item.x + item.width > other.x &&
        item.y < other.y + other.depth &&
        item.y + item.depth > other.y;

      if (isOverlapping) {
        const overlapLeft   = (item.x + item.width) - other.x;
        const overlapRight  = (other.x + other.width) - item.x;
        const overlapTop    = (item.y + item.depth) - other.y;
        const overlapBottom = (item.y + item.depth) - item.y;

        const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

        if (minOverlap === overlapLeft)   item.x = other.x - item.width;
        else if (minOverlap === overlapRight)  item.x = other.x + other.width;
        else if (minOverlap === overlapTop)    item.y = other.y - item.depth;
        else if (minOverlap === overlapBottom) item.y = other.y + other.depth;
      }
    });

    item.x = Math.max(0, Math.min(Math.max(0, v.width - item.width), item.x));
    item.y = Math.max(0, Math.min(Math.max(0, v.depth - item.depth), item.y));

    renderPlacedItems();
    updateMetrics();
  }

  function updateMetrics() {
    const v = getCurrentVehicle();
    
    // 現在選択中車両の情報更新
    headerVehicleName.textContent = v ? v.name : '-';

    // 床面積利用率の計算（現在選択されている車両）
    if (v) {
      const truckArea = v.width * v.depth;
      let currentVehicleArea = 0;
      v.placedItems.forEach(item => {
        currentVehicleArea += item.width * item.depth;
      });
      const rate = truckArea > 0 ? Math.round((currentVehicleArea / truckArea) * 100) : 0;
      headerOccupancyRate.textContent = `${rate}%`;
    } else {
      headerOccupancyRate.textContent = `0%`;
    }

    // 全車両の合計個数と選択中車両の個数の計算
    let grandTotalCount = 0;
    vehicles.forEach(vehicle => {
      grandTotalCount += vehicle.placedItems.length;
    });

    const currentCount = v ? v.placedItems.length : 0;

    // 車両数が複数ある場合は「選択車両/全合計」を表示し、1台のみのときは「X 台」とシンプル表示
    if (vehicles.length > 1) {
      headerItemCount.textContent = `${currentCount} 台 (計 ${grandTotalCount} 台)`;
    } else {
      headerItemCount.textContent = `${currentCount} 台`;
    }

    headerOccupancyRate.className = "font-bold text-emerald-400 ml-1";
  }

  function updateItemListUI() {
    itemListContainer.innerHTML = '';
    const v = getCurrentVehicle();

    if (!v) {
      itemTypeCount.textContent = `0 種類`;
      itemListContainer.innerHTML = '<div class="text-center py-6 text-slate-400 text-xs">積載中の荷物はありません</div>';
      return;
    }

    const summary = {};
    v.placedItems.forEach(item => {
      const key = `${item.name}_${item.width}_${item.depth}_${item.color}`;
      if (!summary[key]) {
        summary[key] = { name: item.name, width: item.width, depth: item.depth, color: item.color, count: 0, ids: [] };
      }
      summary[key].count++;
      summary[key].ids.push(item.id);
    });

    const keys = Object.keys(summary);
    itemTypeCount.textContent = `${keys.length} 種類`;

    if (keys.length === 0) {
      itemListContainer.innerHTML = '<div class="text-center py-6 text-slate-400 text-xs">積載中の荷物はありません</div>';
      return;
    }

    keys.forEach(key => {
      const group = summary[key];
      const card = document.createElement('div');
      card.className = "bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs flex justify-between items-center";
      
      card.innerHTML = `
        <div class="flex items-center gap-2 overflow-hidden">
          <div class="w-3 h-3 rounded-full shrink-0" style="background-color: ${group.color};"></div>
          <div class="truncate">
            <div class="font-bold text-slate-700 truncate">${group.name}</div>
            <div class="text-[10px] text-slate-400 font-mono">${group.width}×${group.depth} mm</div>
          </div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <span class="bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded-full text-[10px]">${group.count}台</span>
        </div>
      `;

      itemListContainer.appendChild(card);
    });
  }

  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
